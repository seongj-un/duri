# 로컬에서 "배포된 것처럼" 띄운다.
#
# compose.yaml 과 나눈 이유: 그쪽은 bootRun 이 자동으로 띄우는 개발용 DB 하나뿐이다.
# 여기에 백엔드까지 넣으면 개발 중에 컨테이너 백엔드가 같이 떠서 포트를 다툰다.
#
# 실제 배포(Vercel 프론트 + Railway 백엔드)와 같은 모양으로 맞췄다:
# 프론트와 백엔드가 다른 오리진이고, 프론트는 빌드 시점에 백엔드 주소를 박는다.
#
#   docker compose -f compose.deploy.yaml up --build
#
# 프론트 포트는 WEB_PORT 로 바꾼다(기본 3100). 3000 은 다른 개발 서버가 쓰는 일이 잦다.

name: duri-deploy

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: duri
      POSTGRES_USER: duri
      POSTGRES_PASSWORD: duri
      TZ: Asia/Seoul
    # 호스트로 내보내지 않는다. api 만 붙으면 된다.
    volumes:
      - duri-deploy-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U duri -d duri"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/duri
      DB_USERNAME: duri
      DB_PASSWORD: duri

      # 로컬 확인용 기본값. 운영에서는 반드시 주입한다.
      JWT_SECRET: ${JWT_SECRET:-ZHVyaS1kZXYtb25seS1qd3Qtc2VjcmV0LTMyYnl0ZXM=}
      ACCOUNT_ENCRYPTION_KEY: ${ACCOUNT_ENCRYPTION_KEY:-ZHVyaS1kZXYtb25seS1hY2NvdW50LWtleS0zMmJ5dGU=}

      # 프론트가 다른 오리진이라 Lax 로는 리프레시 쿠키가 실리지 않는다.
      # 브라우저는 localhost 를 보안 컨텍스트로 보므로 http 여도 Secure 쿠키가 통한다.
      COOKIE_SAME_SITE: None
      COOKIE_SECURE: "true"

      CORS_ALLOWED_ORIGINS: http://localhost:${WEB_PORT:-3100}
      INVITE_BASE_URL: http://localhost:${WEB_PORT:-3100}/invite

      # 앞에 프록시가 없다. X-Forwarded-* 를 믿을 이유가 없으므로 켜지 않는다.

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        # 번들에 박히는 값이라 빌드 인자로 넘긴다.
        VITE_API_BASE_URL: http://localhost:8080
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-3100}:80"

volumes:
  duri-deploy-pgdata:
