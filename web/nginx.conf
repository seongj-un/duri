# vercel.json 의 규칙을 그대로 옮긴 것. 로컬 배포와 실제 배포가 다르게 동작하면
# 여기서 확인한 의미가 없다.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # 서비스워커는 캐시하지 않는다. 캐시되면 영영 갱신되지 않아
    # 사용자가 옛 앱에 갇힌다.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
    }

    # index.html 도 캐시하지 않는다. 새 배포가 바로 잡혀야 한다.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # 파일명에 해시가 박혀 있어 내용이 바뀌면 이름도 바뀐다. 영구 캐시로 둔다.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA: 실제 파일이 있으면 그것을, 없으면 index.html 로 돌려보낸다.
    # 정적 파일이 rewrite 보다 먼저 잡히는 순서다.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
